<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel</title>

    <!-- Som -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

    <!-- Socket -->
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: Arial;
        }

        #video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        #painel {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: white;
            display: none;
            z-index: 10;
        }

        h1 {
            font-size: 50px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<!-- 🎥 VÍDEO COMPATÍVEL COM TV -->
<video id="video" autoplay muted playsinline webkit-playsinline preload="auto">
    <source src="{{ url_for('static', filename='videos/video1.mp4') }}" type="video/mp4">
</video>

<!-- 📋 PAINEL -->
<div id="painel">
    <h1 id="sala"></h1>
    <h1 id="senha"></h1>
    <h1 id="doutor"></h1>
</div>

<script>
    const socket = io();

    const video = document.getElementById('video');
    const painel = document.getElementById('painel');

    // 🔇 FORÇA SEM SOM (TV SAMSUNG)
    video.muted = true;
    video.volume = 0;

    // 🔊 SOM (HOWLER - MELHOR PRA TV)
    const som = new Howl({
        src: ["{{ url_for('static', filename='audio/som.mp3') }}"],
        html5: true,
        volume: 1.0
    });

    // 🎬 LISTA DE VÍDEOS
    const videos = [
        "{{ url_for('static', filename='videos/video1.mp4') }}",
        "{{ url_for('static', filename='videos/video2.mp4') }}",
        "{{ url_for('static', filename='videos/video3.mp4') }}",
        "{{ url_for('static', filename='videos/video4.mp4') }}"
    ];

    let index = 0;
    let timeout;

    // 🔥 FORÇA CARREGAMENTO (IMPORTANTE PRA TV)
    function iniciarVideo() {
        video.load();
        video.play().catch(e => console.log("Erro play:", e));
    }

    // 🔁 TROCA AUTOMÁTICA DE VÍDEO
    video.addEventListener('ended', () => {
        index++;
        if (index >= videos.length) index = 0;

        video.src = videos[index];
        iniciarVideo();
    });

    // 🚀 INICIA VÍDEO AO CARREGAR
    window.onload = () => {
        iniciarVideo();
    };

    // 📡 RECEBE CHAMADA
    socket.on('receive_chamada', (data) => {

        // Atualiza textos
        document.getElementById('sala').innerText = data.sala || "-";
        document.getElementById('senha').innerText = data.senha || "-";
        document.getElementById('doutor').innerText = data.doutor || "-";

        // Para vídeo
        video.pause();
        video.style.display = "none";

        // Mostra painel
        painel.style.display = "block";

        // 🔊 TOCA SOM
        som.play();

        clearTimeout(timeout);

        // ⏱ 10 SEGUNDOS
        timeout = setTimeout(() => {
            painel.style.display = "none";
            video.style.display = "block";
            iniciarVideo();
        }, 10000);
    });

    // 🔓 DESBLOQUEIA ÁUDIO (CASO A TV EXIJA INTERAÇÃO)
    document.body.addEventListener('click', () => {
        som.play();
        som.stop();
    }, { once: true });

</script>

</body>
</html>
