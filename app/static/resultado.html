<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: Arial;
        }

        #video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #painel {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: white;
            display: none;
            z-index: 10;
        }

        h1 {
            font-size: 40px;
            margin: 10px;
        }

        .valor {
            font-size: 50px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<video id="video" autoplay muted playsinline webkit-playsinline>
    <source src="{{ url_for('static', filename='videos/video1.mp4') }}">
</video>

<div id="painel">
    <h1>Sala:</h1>
    <div id="sala" class="valor"></div>

    <h1>Paciente:</h1>
    <div id="senha" class="valor"></div>

    <h1>Profissional:</h1>
    <div id="doutor" class="valor"></div>
</div>

<script>
    const socket = io();

    const video = document.getElementById('video');
    const painel = document.getElementById('painel');

    // 🔇 SEMPRE sem som
    video.muted = true;
    video.volume = 0;

    // 🔊 SOM
    const som = new Howl({
        src: ["{{ url_for('static', filename='audio/som.mp3') }}"],
        html5: true,
        volume: 1.0
    });

    let timeout;
    let tempoAtual = 0; // 🔥 guarda onde o vídeo parou

    // 🎬 LISTA DE VÍDEOS
    const videos = [
        "{{ url_for('static', filename='videos/video1.mp4') }}",
        "{{ url_for('static', filename='videos/video2.mp4') }}",
        "{{ url_for('static', filename='videos/video3.mp4') }}"
    ];

    let index = 0;

    // 🔁 troca de vídeo normal (quando termina)
    video.addEventListener('ended', () => {
        index++;
        if (index >= videos.length) index = 0;

        video.src = videos[index];
        video.load();
        video.play();
    });

    // 📡 RECEBE CHAMADA
    socket.on('receive_chamada', (data) => {

        // Atualiza textos
        document.getElementById('sala').innerText = data.sala || "-";
        document.getElementById('senha').innerText = data.senha || "-";
        document.getElementById('doutor').innerText = data.doutor || "-";

        // 🔥 GUARDA TEMPO ATUAL DO VÍDEO
        tempoAtual = video.currentTime;

        // Para vídeo
        video.pause();
        video.style.display = "none";

        // Mostra painel
        painel.style.display = "block";

        // 🔊 TOCA SOM (forçado)
        try {
            som.stop();
            som.play();
        } catch(e) {
            console.log(e);
        }

        clearTimeout(timeout);

        // ⏱ 10 segundos
        timeout = setTimeout(() => {
            painel.style.display = "none";
            video.style.display = "block";

            // 🔥 VOLTA DE ONDE PAROU
            video.currentTime = tempoAtual;

            video.play().catch(e => console.log(e));

        }, 10000);
    });

    // 🔓 LIBERA ÁUDIO NA TV
    document.body.addEventListener('click', () => {
        som.play();
        som.stop();
    }, { once: true });

</script>

</body>
</html>
